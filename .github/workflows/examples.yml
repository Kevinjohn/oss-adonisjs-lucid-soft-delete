name: examples

on:
  pull_request:
    paths:
      - 'examples/starter/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'index.ts'
      - 'configure.ts'
      - 'src/**'
      - 'providers/**'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  starter:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [api, hypermedia, inertia_react, inertia_vue]
    env:
      HOST: 127.0.0.1
    defaults:
      run:
        working-directory: examples/starter/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm --dir ../../.. install --frozen-lockfile
      # The packed archive's checksum changes with every build, so the lockfile is not frozen.
      - run: pnpm kit:pack
      - run: pnpm install --no-frozen-lockfile
      - run: |
          cp .env.example .env
          pnpm exec node ace generate:key --force
          pnpm exec node ace codegen
          pnpm exec node ace migration:run --force
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Start Vite for the browser tests
        if: matrix.example != 'api'
        run: |
          PLAYWRIGHT_CLI=$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('playwright/package.json', {paths:[require.resolve('@japa/browser-client')]})), 'cli.js')")
          node "$PLAYWRIGHT_CLI" install --with-deps chromium
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/example-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/@vite/client >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/@vite/client >/dev/null
      - run: pnpm test
