name: checks

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/scorecard.yml'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/scorecard.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Push and pull request runs start once the repository is public, where hosted minutes are
    # free. Manual and release runs always start.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [better-sqlite3, pg, mysql2]
    env:
      DB_CLIENT: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database == 'mysql2' && 3306 || 5432 }}
      DB_USER: ${{ matrix.database == 'mysql2' && 'root' || 'postgres' }}
      DB_PASSWORD: ${{ matrix.database == 'mysql2' && 'root' || 'postgres' }}
      DB_DATABASE: package_test
    services:
      postgres:
        image: ${{ matrix.database == 'pg' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: package_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: ${{ matrix.database == 'mysql2' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: package_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.database == 'better-sqlite3'
        name: Check formatting
        run: pnpm format:check
      - if: matrix.database == 'better-sqlite3'
        run: pnpm lint
      - if: matrix.database == 'better-sqlite3'
        run: pnpm docs:check
      - if: matrix.database == 'better-sqlite3'
        run: pnpm typecheck
      - run: pnpm test
      - if: matrix.database == 'better-sqlite3'
        run: pnpm build
      - if: matrix.database == 'better-sqlite3'
        run: pnpm test:built-exports
      - if: matrix.database == 'better-sqlite3'
        run: pnpm test:consumer
