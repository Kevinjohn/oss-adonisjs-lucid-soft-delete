name: release
on:
  workflow_dispatch:
# Only the job that creates the release can write; the checks it calls get read access.
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Only main releases
        run: test "$GITHUB_REF" = "refs/heads/main" || { echo "release runs on main only"; exit 1; }
      - name: Verify checks for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --branch main --commit "$GITHUB_SHA" --limit 1 --json databaseId,headSha,event |
            jq -er --arg sha "$GITHUB_SHA" '.[0] | select(.headSha == $sha and (.event == "push" or .event == "workflow_dispatch")) | .databaseId | numbers'); then
            echo "Could not find checks.yml CI for main commit $GITHUB_SHA" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" |
            jq -e --argjson required '["checks (better-sqlite3)", "checks (pg)", "checks (mysql2)"]' '.jobs as $jobs | all($required[]; . as $name | any($jobs[]; .name == $name and .status == "completed" and .conclusion == "success"))' >/dev/null; then
            echo "Could not verify every required check succeeded in CI run $run_id" >&2
            exit 1
          fi
  # Installing and building run dependency code, so they hold a read-only token.
  package:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.check.outputs.version }}
      tarball: ${{ steps.check.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Release checks (tag, changelog, build, pack)
        id: check
        run: bash bin/release_check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: tmp/release/
          if-no-files-found: error
  # Only this job can write, and it runs no repository or dependency code.
  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: release, path: tmp/release }
      - name: Create release
        env:
          GH_TOKEN: '${{ github.token }}'
          VERSION: '${{ needs.package.outputs.version }}'
          TARBALL: '${{ needs.package.outputs.tarball }}'
        run: gh release create "v$VERSION" "tmp/release/$TARBALL" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "$VERSION" --notes-file tmp/release/notes.md
