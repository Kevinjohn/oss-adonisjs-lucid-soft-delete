name: release
on:
  workflow_dispatch:
# Only the job that creates the release can write; the checks it calls get read access.
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only main releases
        run: test "$GITHUB_REF" = "refs/heads/main" || { echo "release runs on main only"; exit 1; }
  checks:
    needs: guard
    uses: ./.github/workflows/checks.yml
  compat:
    needs: guard
    uses: ./.github/workflows/compat.yml
  # Installing and building run dependency code, so they hold a read-only token.
  package:
    needs: [checks, compat]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.check.outputs.version }}
      tarball: ${{ steps.check.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Release checks (tag, changelog, build, pack)
        id: check
        run: bash bin/release_check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: tmp/release/
          if-no-files-found: error
  # Only this job can write, and it runs no repository or dependency code.
  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: release, path: tmp/release }
      - name: Create release
        env:
          GH_TOKEN: '${{ github.token }}'
          VERSION: '${{ needs.package.outputs.version }}'
          TARBALL: '${{ needs.package.outputs.tarball }}'
        run: gh release create "v$VERSION" "tmp/release/$TARBALL" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "$VERSION" --notes-file tmp/release/notes.md
