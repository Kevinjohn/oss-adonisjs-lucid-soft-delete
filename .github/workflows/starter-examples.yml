name: starter-examples

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  STARTER_EXAMPLES_REF: v0.10.0

jobs:
  combined:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kit: [api, hypermedia, inertia-react, inertia-vue]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: package
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Kevinjohn/oss-adonisjs-starter-examples
          ref: ${{ env.STARTER_EXAMPLES_REF }}
          path: starter-examples
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: starter-examples/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: pnpm --dir package install --frozen-lockfile
      - run: pnpm --dir starter-examples install --frozen-lockfile
      - run: test "$(git -C starter-examples rev-parse HEAD)" = a76d812421138169d0cb76374191887c847b37de
      - run: git -C starter-examples apply --index "$GITHUB_WORKSPACE/package/tests/fixtures/starter-examples/v0.10.0.patch"
      - run: pnpm --dir starter-examples assemble --kit ${{ matrix.kit }} --with-local "$GITHUB_WORKSPACE/package" --out "$GITHUB_WORKSPACE/starter-examples/tmp/combined"
      - run: |
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const app = path.join("starter-examples/tmp/combined", process.argv[1]); const asset = "kevinjohn-adonisjs-lucid-soft-delete.tgz"; const manifest = JSON.parse(fs.readFileSync(path.join(app, "package.json"), "utf8")); if (manifest.dependencies["@kevinjohn/adonisjs-lucid-soft-delete"] !== `file:vendor/${asset}` || !fs.existsSync(path.join(app, "vendor", asset))) process.exit(1)' "${{ matrix.kit }}"
      - run: pnpm --dir starter-examples test:app --kit ${{ matrix.kit }} --dir tmp/combined --install-browsers
