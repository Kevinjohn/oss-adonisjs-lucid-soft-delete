# Update policy: follow AdonisJS.
# - Patch updates: always, checked weekly and grouped into one pull request.
# - Minor updates: only for AdonisJS-owned packages, and only once the release is 30 days old.
#   Everything else (TypeScript included) moves to a new minor by hand, when AdonisJS moves.
# - Major updates: never. Raise them by hand alongside an AdonisJS major.
# Dependabot allows one schedule per ecosystem and directory, so minors cannot run monthly while
# patches run weekly. The minor cooldown stands in for the slower minor cadence.
# Dependabot `ignore` rules cannot exclude a pattern, so the minor rule lists the non-AdonisJS
# packages. Add new third-party dependencies to that list.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-minor-days: 30
    groups:
      patches:
        update-types: ['patch']
      adonisjs-minor:
        patterns: ['@adonisjs/*', '@vinejs/*', '@japa/*', '@poppinss/*']
        update-types: ['minor']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/*'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'better-sqlite3'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'c8'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'cross-env'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'luxon'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'mysql2'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'pg'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'prettier'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'tsdown'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-minor']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
